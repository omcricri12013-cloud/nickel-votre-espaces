<!DOCTYPE html>
<html lang="fr">
  
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NICKEL - Banque en ligne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      :root {
        --hsbc-red: #db0011;
        --hsbc-dark-red: #a5000d;
        --hsbc-light-red: #ff1428;
        --gradient-bg: linear-gradient(135deg, #db0011 0%, #a5000d 100%);
        --text-white: #ffffff;
        --text-dark: #2c3e50;
        --shadow-light: 0 4px 20px rgba(219, 0, 17, 0.15);
        --shadow-heavy: 0 8px 40px rgba(219, 0, 17, 0.25);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--gradient-bg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow-x: hidden;
      }

      /* Animated background */
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 20% 80%, rgba(255, 20, 40, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(165, 0, 13, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(219, 0, 17, 0.2) 0%, transparent 50%);
        animation: float 6s ease-in-out infinite;
        z-index: 1;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }

      .container {
        position: relative;
        z-index: 2;
        text-align: center;
        max-width: 450px;
        width: 90%;
        padding: 3rem 2rem;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        box-shadow: var(--shadow-heavy);
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: slideUp 0.8s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo-container {
        margin-bottom: 2rem;
        animation: logoFloat 3s ease-in-out infinite;
      }

      @keyframes logoFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .logo {
        max-width: 200px;
        height: auto;
        filter: drop-shadow(0 4px 12px rgba(219, 0, 17, 0.3));
        transition: all 0.3s ease;
      }

      .logo:hover {
        transform: scale(1.05);
        filter: drop-shadow(0 6px 16px rgba(219, 0, 17, 0.4));
      }

      .welcome-text {
        margin-bottom: 2.5rem;
      }

      .welcome-title {
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
      }

      .welcome-subtitle {
        font-size: 1.1rem;
        color: #6b7280;
        font-weight: 400;
        line-height: 1.5;
      }

      .cta-button {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 16px 32px;
        background: var(--gradient-bg);
        color: var(--text-white);
        text-decoration: none;
        border-radius: 16px;
        font-weight: 600;
        font-size: 1.1rem;
        box-shadow: var(--shadow-light);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }

      .cta-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.6s;
      }

      .cta-button:hover::before {
        left: 100%;
      }

      .cta-button:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-heavy);
        background: linear-gradient(135deg, #ff1428 0%, #db0011 100%);
      }

      .cta-button:active {
        transform: translateY(0);
      }

      .cta-icon {
        font-size: 1.2rem;
        transition: transform 0.3s ease;
      }

      .cta-button:hover .cta-icon {
        transform: translateX(4px);
      }

      .features {
        margin-top: 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 1rem;
      }

      .feature {
        padding: 1rem;
        background: rgba(219, 0, 17, 0.05);
        border-radius: 12px;
        text-align: center;
        transition: all 0.3s ease;
      }

      .feature:hover {
        background: rgba(219, 0, 17, 0.1);
        transform: translateY(-2px);
      }

      .feature-icon {
        font-size: 1.5rem;
        color: var(--hsbc-red);
        margin-bottom: 0.5rem;
      }

      .feature-text {
        font-size: 0.85rem;
        color: var(--text-dark);
        font-weight: 500;
      }

      /* Media queries */
      @media screen and (max-width: 768px) {
        .container {
          padding: 2rem 1.5rem;
          margin: 1rem;
        }
        
        .welcome-title {
          font-size: 1.8rem;
        }
        
        .welcome-subtitle {
          font-size: 1rem;
        }
        
        .cta-button {
          width: 100%;
          justify-content: center;
        }
      }

      @media screen and (max-width: 480px) {
        .container {
          padding: 1.5rem 1rem;
        }
        
        .welcome-title {
          font-size: 1.6rem;
        }
        
        .features {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <img src="assets/images/logo.png" alt="HSBC" class="logo" />
      </div>
      
      <div class="welcome-text">
        <h1 class="welcome-title">Bienvenue</h1>
        <p class="welcome-subtitle">Accédez à votre espace client sécurisé pour gérer vos comptes et services bancaires</p>
      </div>
      
      <a href="connexion.html" class="cta-button">
        <span>Accéder à mon espace</span>
        <i class="fas fa-arrow-right cta-icon"></i>
      </a>
      
      <div class="features">
        <div class="feature">
          <div class="feature-icon">
            <i class="fas fa-shield-alt"></i>
          </div>
          <div class="feature-text">Sécurisé</div>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <i class="fas fa-mobile-alt"></i>
          </div>
          <div class="feature-text">Mobile</div>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <i class="fas fa-clock"></i>
          </div>
          <div class="feature-text">24h/24</div>
        </div>
      </div>
    </div>
  </body>

</html>
